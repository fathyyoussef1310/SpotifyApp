name: spotifyyapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  get: ^4.7.2
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1
  flutter_bloc: ^9.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/Audio/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/spotifyIcon.png"
  adaptive_icon_foreground: "assets/icons/spotifyIcon.png"
  adaptive_icon_background: "#1DB954"
  min_sdk_android: 10
  remove_alpha_ios: true
