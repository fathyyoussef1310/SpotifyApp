name: spotifyyapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  get: ^4.7.2
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  just_audio: ^0.10.5
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/Audio/
flutter_launcher_icons:
  android: true
  ios: true

  windows:
    generate: true
    image_path: "assets/icons/icon.png"

  image_path: "assets/icons/icon.png"

  adaptive_icon_foreground: "assets/icons/icon.png"
  adaptive_icon_background: "#000000"

  min_sdk_android: 21
  remove_alpha_ios: true
